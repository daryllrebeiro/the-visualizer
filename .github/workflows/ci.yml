name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.22.0'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─────────────────────────────────────────
  # Job 1: Install & Cache
  # ─────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache workspace node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

  # ─────────────────────────────────────────
  # Job 2: Lint & Format Check
  # ─────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (fallback)
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run lint
        run: pnpm lint

  # ─────────────────────────────────────────
  # Job 3: Type Check
  # ─────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (fallback)
        run: pnpm install --frozen-lockfile
      - name: Type check all packages
        run: pnpm typecheck

  # ─────────────────────────────────────────
  # Job 4: Unit Tests
  # ─────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (fallback)
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm turbo run build --filter=./packages/*
      - name: Run unit tests
        run: pnpm test:all
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────
  # Job 4b: Golden Determinism Gate (REQUIRED)
  # ─────────────────────────────────────────
  test-determinism:
    name: Golden Determinism Gate
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (fallback)
        run: pnpm install --frozen-lockfile
      - name: Build simulation package
        run: pnpm turbo run build --filter=@the-visualizer/simulation
      - name: Run golden determinism suite
        run: pnpm test:determinism

  # ─────────────────────────────────────────
  # Job 5: Integration Tests (with services)
  # ─────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visualizer
          POSTGRES_PASSWORD: visualizer_test
          POSTGRES_DB: visualizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (fallback)
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://visualizer:visualizer_test@localhost:5432/visualizer_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ─────────────────────────────────────────
  # Job 6: Secret Scanning (TruffleHog)
  # ─────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ─────────────────────────────────────────
  # Job 7: Build All
  # ─────────────────────────────────────────
  build:
    name: Build All Packages & Apps
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-determinism]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (fallback)
        run: pnpm install --frozen-lockfile
      - name: Build (Turborepo with remote cache)
        run: pnpm build
      - name: Verify build artifacts
        run: |
          test -d packages/simulation/dist && echo "✓ simulation built"
          test -d packages/contracts/dist  && echo "✓ contracts built"
          test -d packages/logging/dist    && echo "✓ logging built"
          test -d packages/config/dist     && echo "✓ config built"
          test -d apps/api/dist            && echo "✓ api built"
          test -d apps/ws-gateway/dist     && echo "✓ ws-gateway built"

  # ─────────────────────────────────────────
  # Job 8: Container Scan (Trivy) — only on main
  # ─────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        run: docker build -f infrastructure/docker/api.Dockerfile -t the-visualizer-api:ci .
      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'the-visualizer-api:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Build WS-Gateway Docker image
        run: docker build -f infrastructure/docker/ws-gateway.Dockerfile -t the-visualizer-ws-gateway:ci .
      - name: Run Trivy vulnerability scanner (WS-Gateway)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'the-visualizer-ws-gateway:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────
  # Job 9: Automated Load Testing (k6)
  # ─────────────────────────────────────────
  load-test:
    name: Automated Load Testing & Latency Gate
    runs-on: ubuntu-latest
    needs: [test-integration, build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visualizer
          POSTGRES_PASSWORD: visualizer_test
          POSTGRES_DB: visualizer_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Start API and WS-Gateway in Background
        run: |
          node apps/api/dist/index.js &
          node apps/ws-gateway/dist/index.js &
          sleep 5
        env:
          PORT: 3000
          WS_GATEWAY_PORT: 3001
          DATABASE_URL: postgresql://visualizer:visualizer_test@localhost:5432/visualizer_test
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: super-secret-key-that-is-at-least-32-chars-long
          JWT_SECRET: super-secret-key-that-is-at-least-32-chars-long
          NODE_ENV: test
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Execute k6 API Load Test
        run: k6 run infrastructure/load-test/api.js
      - name: Execute k6 WebSocket Load Test
        run: k6 run infrastructure/load-test/websocket.js

  # ─────────────────────────────────────────
  # Job 10: Docker Base Image Pinning Check
  # ─────────────────────────────────────────
  docker-pinning:
    name: Docker Image Pinning Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check Dockerfile Base Image Digests
        run: node scripts/check-docker-pinning.mjs

  # ─────────────────────────────────────────
  # Job 11: SBOM Generation (CycloneDX/SPDX)
  # ─────────────────────────────────────────
  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Repository SBOM via Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: ./sbom.spdx.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdx-sbom
          path: ./sbom.spdx.json

  # ─────────────────────────────────────────
  # Job 12: Real Rate Limiting & Frame Cap Ingress
  # ─────────────────────────────────────────
  rate-limiting-ingress:
    name: Rate Limiting & 1MB Frame Cap Gate
    runs-on: ubuntu-latest
    needs: [build]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Start WS Gateway
        run: |
          node apps/ws-gateway/dist/index.js &
          sleep 4
        env:
          WS_GATEWAY_PORT: 4001
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: 01234567890123456789012345678901
          JWT_SECRET: 01234567890123456789012345678901
          NODE_ENV: test
      - name: Verify Live Rate Limits & Oversized Frame Rejection
        run: node scripts/verify-rate-limiting.mjs

  # ─────────────────────────────────────────
  # Job 13: Live WebSocket Concurrency & Memory Gate
  # ─────────────────────────────────────────
  ws-concurrency-gate:
    name: WebSocket Concurrency & Zero-Drop Gate
    runs-on: ubuntu-latest
    needs: [build]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Execute Live Load Test Suite
        run: node scripts/run-load-test-suite.mjs
        env:
          SESSION_SECRET: 01234567890123456789012345678901
          JWT_SECRET: 01234567890123456789012345678901

  # ─────────────────────────────────────────
  # Job 14: WCAG 2.1 AA Accessibility Gate (axe-core)
  # ─────────────────────────────────────────
  accessibility-gate:
    name: WCAG 2.1 AA Production Route Scan (axe-core)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web App
        run: pnpm --filter @the-visualizer/web build
      - name: Start Web Server in Background
        run: |
          pnpm --filter @the-visualizer/web start -- -p 3005 &
          sleep 5
      - name: Run axe-core Production Route Audit
        run: node scripts/run-axe-core-audit.mjs

  # ─────────────────────────────────────────
  # Job 15: Lighthouse Core Web Vitals Performance Gate
  # ─────────────────────────────────────────
  performance-gate:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web App
        run: pnpm --filter @the-visualizer/web build
      - name: Start Web Server in Background
        run: |
          pnpm --filter @the-visualizer/web start -- -p 3005 &
          sleep 5
      - name: Run Headless Chrome Lighthouse Audit
        run: node scripts/run-lighthouse-audit.mjs

