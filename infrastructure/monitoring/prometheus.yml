global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'ws-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001']
