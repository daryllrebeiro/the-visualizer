services:
  redis:
    image: redis:7-alpine@sha256:c1eaf91196a1a457497ec027b4096057a66e4a2d3c9dc2e811c76949d21c0ad1
    container_name: kafka-visualizer-redis
    command: redis-server --requirepass redis_local_secret
    ports:
      - "6379:6379"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_local_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine@sha256:4d8745ea79e4369e59d9a1c1d017a760c6d70d7eb7fc8fa6d3f2711dc59c4033
    container_name: kafka-visualizer-postgres
    environment:
      POSTGRES_USER: visualizer_user
      POSTGRES_PASSWORD: visualizer_password
      POSTGRES_DB: visualizer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualizer_user -d visualizer_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: kafka-visualizer-api
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      PORT: "3000"
      REDIS_URL: "redis://:redis_local_secret@redis:6379"
      DATABASE_URL: "postgresql://visualizer_user:visualizer_password@postgres:5432/visualizer_db"
      SESSION_SECRET: "super-secret-key-that-is-at-least-32-chars-long"
      JWT_SECRET: "super-secret-key-that-is-at-least-32-chars-long"
      ALLOWED_ORIGINS: "http://localhost:3002,http://127.0.0.1:3002"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ws-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/ws-gateway.Dockerfile
    container_name: kafka-visualizer-ws-gateway
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      PORT: "3001"
      REDIS_URL: "redis://:redis_local_secret@redis:6379"
      SESSION_SECRET: "super-secret-key-that-is-at-least-32-chars-long"
      JWT_SECRET: "super-secret-key-that-is-at-least-32-chars-long"
      ALLOWED_ORIGINS: "http://localhost:3002,http://127.0.0.1:3002"
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafka-visualizer-web
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:3001"
    ports:
      - "3002:3002"
    depends_on:
      - api
      - ws-gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:373f1d3eef4a873132cf05d6cb44322471b6cb46e8c89c89ceba7a0d4c8851c1
    container_name: kafka-visualizer-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0@sha256:d8ba39c9f7a77e1bf9a660a952243d9c79ecf79a9bc48972ec0b4e0bf129ba04
    container_name: kafka-visualizer-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
